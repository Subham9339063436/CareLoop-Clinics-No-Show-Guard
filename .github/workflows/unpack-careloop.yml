name: Publish prepared CareLoop files

on:
  push:
    paths:
      - ".github/workflows/unpack-careloop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f CareLoop_Project_Files.zip
          mkdir -p /tmp/careloop-unpack
          unzip -q -o CareLoop_Project_Files.zip -d /tmp/careloop-unpack
          source_dir="/tmp/careloop-unpack/CareLoop-Clinics-No-Show-Guard"
          test -d "$source_dir"

          # Preserve the README already updated with verified Part 1–3 findings.
          cp README.md /tmp/careloop-readme.md

          # Publish the archive's notebooks, SQL, source data and generated outputs.
          cp -a "$source_dir"/. .
          cp /tmp/careloop-readme.md README.md

          # Keep the repository tidy; the extracted files now replace the archive.
          rm -f CareLoop_Project_Files.zip
          rm -rf /tmp/careloop-unpack

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Publish prepared CareLoop project files"
          git push
